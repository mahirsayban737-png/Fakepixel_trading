<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakepixel Trading Hub v2.1 | Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            min-height: 100vh;
        }
        
        .minecraft-item {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(71, 85, 105, 0.3);
        }
        
        .glass-card-hover:hover {
            background: rgba(15, 23, 42, 0.7);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.1);
        }
        
        .glow-purple {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        .glow-amber {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 3px;
        }
        
        @keyframes pulse-amber {
            0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
            50% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.4); }
        }
        
        .animate-pulse-amber {
            animation: pulse-amber 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-white antialiased">
    <div id="app">
        <!-- Loading/Auth Check Screen -->
        <div v-if="authChecking" class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="w-16 h-16 border-4 border-amber-500/30 border-t-amber-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400">Verifying admin access...</p>
            </div>
        </div>

        <!-- Access Denied Screen -->
        <div v-else-if="!isAdmin" class="min-h-screen flex items-center justify-center p-4">
            <div class="glass-card rounded-2xl p-8 max-w-md w-full text-center">
                <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i data-lucide="shield-x" class="w-10 h-10 text-red-400"></i>
                </div>
                <h1 class="text-2xl font-bold text-red-400 mb-2">Access Denied</h1>
                <p class="text-slate-400 mb-6">You do not have permission to access the admin panel.</p>
                <a href="index.html" 
                   class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-purple-600 to-violet-600 rounded-lg font-medium transition-all">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    Return to Marketplace
                </a>
            </div>
        </div>

        <!-- Admin Panel -->
        <template v-else>
            <!-- Navigation -->
            <nav class="glass-card sticky top-0 z-50 border-b border-slate-800">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div class="flex items-center justify-between h-16">
                        <!-- Logo -->
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-gradient-to-br from-amber-500 to-orange-600 rounded-lg flex items-center justify-center glow-amber animate-pulse-amber">
                                <i data-lucide="shield" class="w-6 h-6 text-white"></i>
                            </div>
                            <div>
                                <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-300 bg-clip-text text-transparent">
                                    Admin Panel
                                </h1>
                                <p class="text-xs text-slate-500">Fakepixel Hub v2.1</p>
                            </div>
                        </div>
                        
                        <!-- Nav Links -->
                        <div class="hidden md:flex items-center space-x-1">
                            <a href="index.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium transition-all">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="store" class="w-4 h-4"></i>
                                    Marketplace
                                </span>
                            </a>
                            <a href="calculator.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 font-medium transition-all">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="calculator" class="w-4 h-4"></i>
                                    Calculator
                                </span>
                            </a>
                            <a href="admin.html" class="px-4 py-2 rounded-lg bg-amber-500/20 text-amber-300 font-medium transition-all">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="shield" class="w-4 h-4"></i>
                                    Admin
                                </span>
                            </a>
                        </div>
                        
                        <!-- User Section -->
                        <div class="flex items-center space-x-4">
                            <div class="flex items-center space-x-3">
                                <img :src="user?.photoURL || 'https://via.placeholder.com/40'" 
                                     class="w-9 h-9 rounded-full border-2 border-amber-500/50">
                                <div class="hidden sm:block">
                                    <p class="text-sm font-medium text-white">{{ user?.displayName }}</p>
                                    <p class="text-xs text-amber-400">
                                        {{ isSuperAdmin ? '👑 Super Admin' : '🛡️ Admin' }}
                                    </p>
                                </div>
                                <button @click="handleSignOut" 
                                        class="p-2 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition-all">
                                    <i data-lucide="log-out" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                <!-- Stats Overview -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                    <div class="glass-card rounded-xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-slate-400">Total Items</p>
                                <p class="text-3xl font-bold text-purple-400">{{ items.length }}</p>
                            </div>
                            <div class="w-12 h-12 bg-purple-500/20 rounded-lg flex items-center justify-center">
                                <i data-lucide="package" class="w-6 h-6 text-purple-400"></i>
                            </div>
                        </div>
                    </div>
                    <div class="glass-card rounded-xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-slate-400">Active Trades</p>
                                <p class="text-3xl font-bold text-green-400">{{ trades.length }}</p>
                            </div>
                            <div class="w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                                <i data-lucide="repeat" class="w-6 h-6 text-green-400"></i>
                            </div>
                        </div>
                    </div>
                    <div class="glass-card rounded-xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-slate-400">Admins</p>
                                <p class="text-3xl font-bold text-amber-400">{{ admins.length }}</p>
                            </div>
                            <div class="w-12 h-12 bg-amber-500/20 rounded-lg flex items-center justify-center">
                                <i data-lucide="users" class="w-6 h-6 text-amber-400"></i>
                            </div>
                        </div>
                    </div>
                    <div class="glass-card rounded-xl p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-slate-400">Status</p>
                                <p class="text-xl font-bold text-green-400">Online</p>
                            </div>
                            <div class="w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                                <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
                    <button @click="activeTab = 'items'" 
                            :class="activeTab === 'items' ? 'bg-purple-500/20 text-purple-300 border-purple-500/50' : 'bg-slate-800/50 text-slate-400 border-slate-700 hover:border-slate-600'"
                            class="flex items-center gap-2 px-6 py-3 rounded-xl font-medium border transition-all whitespace-nowrap">
                        <i data-lucide="package" class="w-4 h-4"></i>
                        Item Management
                    </button>
                    <button @click="activeTab = 'admins'" 
                            :class="activeTab === 'admins' ? 'bg-amber-500/20 text-amber-300 border-amber-500/50' : 'bg-slate-800/50 text-slate-400 border-slate-700 hover:border-slate-600'"
                            class="flex items-center gap-2 px-6 py-3 rounded-xl font-medium border transition-all whitespace-nowrap">
                        <i data-lucide="shield" class="w-4 h-4"></i>
                        Admin Management
                    </button>
                    <button @click="activeTab = 'trades'" 
                            :class="activeTab === 'trades' ? 'bg-green-500/20 text-green-300 border-green-500/50' : 'bg-slate-800/50 text-slate-400 border-slate-700 hover:border-slate-600'"
                            class="flex items-center gap-2 px-6 py-3 rounded-xl font-medium border transition-all whitespace-nowrap">
                        <i data-lucide="repeat" class="w-4 h-4"></i>
                        Trade Management
                    </button>
                </div>

                <!-- Item Management Tab -->
                <div v-show="activeTab === 'items'" class="space-y-6">
                    <!-- Add Item Form -->
                    <div class="glass-card rounded-2xl p-6">
                        <h3 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                            <i data-lucide="plus-circle" class="w-5 h-5 text-purple-400"></i>
                            {{ editingItem ? 'Edit Item' : 'Add New Item' }}
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="text-sm text-slate-400 mb-1 block">Item Name</label>
                                <input v-model="itemForm.name" type="text" placeholder="Diamond Sword"
                                       class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="text-sm text-slate-400 mb-1 block">Price (coins)</label>
                                <input v-model.number="itemForm.price" type="number" placeholder="1000"
                                       class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                            <div>
                                <label class="text-sm text-slate-400 mb-1 block">Category</label>
                                <select v-model="itemForm.category"
                                        class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                                    <option value="weapons">Weapons</option>
                                    <option value="armor">Armor</option>
                                    <option value="tools">Tools</option>
                                    <option value="resources">Resources</option>
                                    <option value="enchants">Enchantments</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-sm text-slate-400 mb-1 block">Icon URL</label>
                                <input v-model="itemForm.icon" type="text" placeholder="https://mc-heads.net/item/diamond_sword"
                                       class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500">
                            </div>
                        </div>
                        <div class="flex gap-3 mt-4">
                            <button @click="submitItem" :disabled="itemSubmitting"
                                    class="flex items-center gap-2 px-6 py-2 bg-gradient-to-r from-purple-600 to-violet-600 rounded-lg font-medium transition-all shadow-lg shadow-purple-500/20 disabled:opacity-50">
                                <i data-lucide="save" class="w-4 h-4"></i>
                                {{ editingItem ? 'Update Item' : 'Add Item' }}
                            </button>
                            <button v-if="editingItem" @click="cancelEdit"
                                    class="px-6 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                                Cancel
                            </button>
                        </div>
                    </div>

                    <!-- Items List -->
                    <div class="glass-card rounded-2xl overflow-hidden">
                        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                                <i data-lucide="list" class="w-5 h-5 text-purple-400"></i>
                                Items Database ({{ items.length }})
                            </h3>
                            <div class="relative">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input v-model="itemSearch" type="text" placeholder="Search items..."
                                       class="bg-slate-800/50 border border-slate-700 rounded-lg pl-9 pr-4 py-1.5 text-sm text-white focus:outline-none focus:border-purple-500">
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-slate-800/50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-sm font-medium text-slate-400">Item</th>
                                        <th class="px-4 py-3 text-left text-sm font-medium text-slate-400">Category</th>
                                        <th class="px-4 py-3 text-left text-sm font-medium text-slate-400">Price</th>
                                        <th class="px-4 py-3 text-right text-sm font-medium text-slate-400">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800">
                                    <tr v-for="item in filteredItems" :key="item.id" class="hover:bg-slate-800/30 transition-colors">
                                        <td class="px-4 py-3">
                                            <div class="flex items-center gap-3">
                                                <img :src="item.icon || 'https://mc-heads.net/item/diamond'" 
                                                     class="w-10 h-10 minecraft-item bg-slate-800 rounded-lg p-1">
                                                <span class="font-medium text-white">{{ item.name }}</span>
                                            </div>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-1 rounded-full text-xs font-medium capitalize"
                                                  :class="getCategoryColor(item.category)">
                                                {{ item.category }}
                                            </span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="text-green-400 font-medium">{{ formatPrice(item.price) }} coins</span>
                                        </td>
                                        <td class="px-4 py-3 text-right">
                                            <button @click="editItem(item)"
                                                    class="p-2 rounded-lg text-blue-400 hover:bg-blue-500/10 transition-all">
                                                <i data-lucide="edit" class="w-4 h-4"></i>
                                            </button>
                                            <button @click="handleDeleteItem(item.id)"
                                                    class="p-2 rounded-lg text-red-400 hover:bg-red-500/10 transition-all">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr v-if="filteredItems.length === 0">
                                        <td colspan="4" class="px-4 py-8 text-center text-slate-500">
                                            No items found
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Admin Management Tab -->
                <div v-show="activeTab === 'admins'" class="space-y-6">
                    <!-- Add Admin Form -->
                    <div class="glass-card rounded-2xl p-6">
                        <h3 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                            <i data-lucide="user-plus" class="w-5 h-5 text-amber-400"></i>
                            Add New Admin
                        </h3>
                        <div class="flex gap-4">
                            <input v-model="newAdminEmail" type="email" placeholder="Enter email address..."
                                   class="flex-1 bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500">
                            <button @click="handleAddAdmin" :disabled="adminSubmitting || !newAdminEmail"
                                    class="flex items-center gap-2 px-6 py-2 bg-gradient-to-r from-amber-500 to-orange-500 rounded-lg font-medium transition-all shadow-lg shadow-amber-500/20 disabled:opacity-50">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                                Add Admin
                            </button>
                        </div>
                        <p class="text-sm text-slate-500 mt-2">
                            <i data-lucide="info" class="w-4 h-4 inline"></i>
                            Only super admin can add or remove other admins.
                        </p>
                    </div>

                    <!-- Admins List -->
                    <div class="glass-card rounded-2xl overflow-hidden">
                        <div class="p-4 border-b border-slate-800">
                            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                                <i data-lucide="users" class="w-5 h-5 text-amber-400"></i>
                                Admin List ({{ admins.length }})
                            </h3>
                        </div>
                        <div class="divide-y divide-slate-800">
                            <div v-for="admin in admins" :key="admin.email"
                                 class="p-4 flex items-center justify-between hover:bg-slate-800/30 transition-colors">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-full flex items-center justify-center"
                                         :class="admin.isSuperAdmin ? 'bg-amber-500/20' : 'bg-purple-500/20'">
                                        <i :data-lucide="admin.isSuperAdmin ? 'crown' : 'shield'" 
                                           class="w-6 h-6"
                                           :class="admin.isSuperAdmin ? 'text-amber-400' : 'text-purple-400'"></i>
                                    </div>
                                    <div>
                                        <p class="font-medium text-white">{{ admin.email }}</p>
                                        <p class="text-sm" :class="admin.isSuperAdmin ? 'text-amber-400' : 'text-slate-400'">
                                            {{ admin.isSuperAdmin ? '👑 Super Admin (Permanent)' : '🛡️ Admin' }}
                                        </p>
                                    </div>
                                </div>
                                <div v-if="!admin.isSuperAdmin && isSuperAdmin">
                                    <button @click="handleRemoveAdmin(admin.email)"
                                            class="flex items-center gap-2 px-4 py-2 rounded-lg text-red-400 hover:bg-red-500/10 transition-all">
                                        <i data-lucide="user-minus" class="w-4 h-4"></i>
                                        Remove
                                    </button>
                                </div>
                                <div v-else-if="admin.isSuperAdmin">
                                    <span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 text-sm">
                                        Protected
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Trade Management Tab -->
                <div v-show="activeTab === 'trades'" class="space-y-6">
                    <div class="glass-card rounded-2xl overflow-hidden">
                        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                            <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                                <i data-lucide="repeat" class="w-5 h-5 text-green-400"></i>
                                Active Trades ({{ trades.length }})
                            </h3>
                        </div>
                        <div class="divide-y divide-slate-800">
                            <div v-for="trade in trades" :key="trade.id"
                                 class="p-4 hover:bg-slate-800/30 transition-colors">
                                <div class="flex items-center justify-between mb-3">
                                    <div class="flex items-center gap-3">
                                        <img :src="trade.userPhoto || 'https://via.placeholder.com/40'" 
                                             class="w-10 h-10 rounded-full">
                                        <div>
                                            <p class="font-medium text-white">{{ trade.userName }}</p>
                                            <p class="text-sm text-slate-400">{{ trade.userEmail }}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="px-2 py-1 rounded-full text-xs font-medium bg-green-500/20 text-green-400">
                                            {{ getTimeRemaining(trade.expiresAt) }}
                                        </span>
                                        <button @click="handleDeleteTrade(trade.id)"
                                                class="flex items-center gap-2 px-4 py-2 rounded-lg text-red-400 hover:bg-red-500/10 transition-all">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            Delete
                                        </button>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4 text-sm">
                                    <div class="flex-1">
                                        <p class="text-purple-400 mb-1">Offering:</p>
                                        <div class="flex flex-wrap gap-1">
                                            <span v-for="item in trade.offering" :key="item.itemId"
                                                  class="px-2 py-1 bg-slate-800/50 rounded text-slate-300">
                                                {{ getItemName(item.itemId) }} x{{ item.quantity }}
                                            </span>
                                        </div>
                                    </div>
                                    <i data-lucide="arrow-right" class="w-5 h-5 text-slate-500"></i>
                                    <div class="flex-1">
                                        <p class="text-violet-400 mb-1">Seeking:</p>
                                        <div class="flex flex-wrap gap-1">
                                            <span v-for="item in trade.seeking" :key="item.itemId"
                                                  class="px-2 py-1 bg-slate-800/50 rounded text-slate-300">
                                                {{ getItemName(item.itemId) }} x{{ item.quantity }}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div v-if="trades.length === 0" class="p-8 text-center text-slate-500">
                                No active trades
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script src="app.js"></script>
    <script>
        const { createApp, ref, computed, onMounted, onUnmounted } = Vue;
        
        createApp({
            setup() {
                // State
                const user = ref(null);
                const isAdmin = ref(false);
                const isSuperAdmin = ref(false);
                const authChecking = ref(true);
                const activeTab = ref('items');
                
                const items = ref([]);
                const trades = ref([]);
                const admins = ref([]);
                
                const itemForm = ref({
                    name: '',
                    price: 0,
                    category: 'other',
                    icon: ''
                });
                const editingItem = ref(null);
                const itemSubmitting = ref(false);
                const itemSearch = ref('');
                
                const newAdminEmail = ref('');
                const adminSubmitting = ref(false);
                
                let unsubscribeItems = null;
                let unsubscribeTrades = null;
                
                // Computed
                const filteredItems = computed(() => {
                    if (!itemSearch.value) return items.value;
                    const query = itemSearch.value.toLowerCase();
                    return items.value.filter(item => 
                        item.name?.toLowerCase().includes(query) ||
                        item.category?.toLowerCase().includes(query)
                    );
                });
                
                // Methods
                const handleSignOut = async () => {
                    try {
                        await FakepixelHub.signOut();
                        window.location.href = 'index.html';
                    } catch (error) {
                        console.error("Sign out error:", error);
                    }
                };
                
                const getCategoryColor = (category) => {
                    const colors = {
                        weapons: 'bg-red-500/20 text-red-400',
                        armor: 'bg-blue-500/20 text-blue-400',
                        tools: 'bg-yellow-500/20 text-yellow-400',
                        resources: 'bg-green-500/20 text-green-400',
                        enchants: 'bg-purple-500/20 text-purple-400',
                        other: 'bg-slate-500/20 text-slate-400'
                    };
                    return colors[category] || colors.other;
                };
                
                const formatPrice = (price) => {
                    return FakepixelHub.formatPrice(price || 0);
                };
                
                const getTimeRemaining = (expiresAt) => {
                    return FakepixelHub.formatTimeRemaining(expiresAt);
                };
                
                const getItemName = (itemId) => {
                    const item = items.value.find(i => i.id === itemId);
                    return item?.name || 'Unknown';
                };
                
                // Item Methods
                const submitItem = async () => {
                    if (!itemForm.value.name || !user.value) return;
                    
                    itemSubmitting.value = true;
                    
                    try {
                        if (editingItem.value) {
                            await FakepixelHub.updateItem(editingItem.value, itemForm.value, user.value.email);
                        } else {
                            await FakepixelHub.addItem(itemForm.value, user.value.email);
                        }
                        
                        resetItemForm();
                    } catch (error) {
                        console.error("Submit item error:", error);
                        alert(error.message);
                    } finally {
                        itemSubmitting.value = false;
                    }
                };
                
                const editItem = (item) => {
                    editingItem.value = item.id;
                    itemForm.value = {
                        name: item.name,
                        price: item.price,
                        category: item.category,
                        icon: item.icon || ''
                    };
                };
                
                const cancelEdit = () => {
                    resetItemForm();
                };
                
                const resetItemForm = () => {
                    editingItem.value = null;
                    itemForm.value = {
                        name: '',
                        price: 0,
                        category: 'other',
                        icon: ''
                    };
                };
                
                const handleDeleteItem = async (itemId) => {
                    if (!confirm('Are you sure you want to delete this item?')) return;
                    
                    try {
                        await FakepixelHub.deleteItem(itemId, user.value.email);
                    } catch (error) {
                        console.error("Delete item error:", error);
                        alert(error.message);
                    }
                };
                
                // Admin Methods
                const handleAddAdmin = async () => {
                    if (!newAdminEmail.value || !user.value) return;
                    
                    adminSubmitting.value = true;
                    
                    try {
                        await FakepixelHub.addAdmin(newAdminEmail.value, user.value.email);
                        newAdminEmail.value = '';
                        await loadAdmins();
                    } catch (error) {
                        console.error("Add admin error:", error);
                        alert(error.message);
                    } finally {
                        adminSubmitting.value = false;
                    }
                };
                
                const handleRemoveAdmin = async (email) => {
                    if (!confirm(`Are you sure you want to remove ${email} as admin?`)) return;
                    
                    try {
                        await FakepixelHub.removeAdmin(email, user.value.email);
                        await loadAdmins();
                    } catch (error) {
                        console.error("Remove admin error:", error);
                        alert(error.message);
                    }
                };
                
                const loadAdmins = async () => {
                    admins.value = await FakepixelHub.getAllAdmins();
                };
                
                // Trade Methods
                const handleDeleteTrade = async (tradeId) => {
                    if (!confirm('Are you sure you want to delete this trade?')) return;
                    
                    try {
                        await FakepixelHub.deleteTrade(tradeId, user.value.uid, user.value.email);
                    } catch (error) {
                        console.error("Delete trade error:", error);
                        alert(error.message);
                    }
                };
                
                // Lifecycle
                onMounted(() => {
                    // Auth state listener with admin check
                    FakepixelHub.auth.onAuthStateChanged(async (firebaseUser) => {
                        user.value = firebaseUser;
                        
                        if (!firebaseUser) {
                            // Not logged in, redirect
                            authChecking.value = false;
                            isAdmin.value = false;
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 2000);
                            return;
                        }
                        
                        // Check admin status
                        const adminStatus = await FakepixelHub.checkIsAdmin(firebaseUser.email);
                        isAdmin.value = adminStatus;
                        isSuperAdmin.value = firebaseUser.email === FakepixelHub.SUPER_ADMIN_EMAIL;
                        authChecking.value = false;
                        
                        if (!adminStatus) {
                            // Not an admin, will show access denied and redirect
                            setTimeout(() => {
                                window.location.href = 'index.html';
                            }, 3000);
                            return;
                        }
                        
                        // Load admins list
                        await loadAdmins();
                    });
                    
                    // Subscribe to items
                    unsubscribeItems = FakepixelHub.subscribeToItems((itemsList) => {
                        items.value = itemsList;
                    });
                    
                    // Subscribe to trades
                    unsubscribeTrades = FakepixelHub.subscribeToTrades((tradesList) => {
                        trades.value = tradesList;
                    });
                    
                    // Initialize Lucide icons
                    lucide.createIcons();
                });
                
                onUnmounted(() => {
                    if (unsubscribeItems) unsubscribeItems();
                    if (unsubscribeTrades) unsubscribeTrades();
                });
                
                return {
                    user,
                    isAdmin,
                    isSuperAdmin,
                    authChecking,
                    activeTab,
                    items,
                    trades,
                    admins,
                    itemForm,
                    editingItem,
                    itemSubmitting,
                    itemSearch,
                    newAdminEmail,
                    adminSubmitting,
                    filteredItems,
                    handleSignOut,
                    getCategoryColor,
                    formatPrice,
                    getTimeRemaining,
                    getItemName,
                    submitItem,
                    editItem,
                    cancelEdit,
                    handleDeleteItem,
                    handleAddAdmin,
                    handleRemoveAdmin,
                    handleDeleteTrade
                };
            }
        }).mount('#app');
        
        // Re-init icons when Vue updates DOM
        setInterval(() => lucide.createIcons(), 1000);
    </script>
</body>
</html>
